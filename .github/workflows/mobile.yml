name: Mobile

# Proves the Tauri mobile targets build. These jobs are slow (a cold Rust
# cross-compile is 10-20 minutes) and the iOS one burns macOS minutes, so
# they run on a weekly schedule, on demand, and on changes to the native
# crate or the frontend export pipeline — not on every PR. The cheap,
# OS-independent proof that the *frontend* exports correctly runs on every
# PR in ci.yml; this workflow is what turns "no toolchain locally" into
# "proven in CI".
#
# Neither job needs signing. Android builds a Gradle-debug-keystore APK;
# iOS builds for the simulator with code signing disabled. Both call the
# Tauri CLI directly (tauri-action's mobile input is experimental and cannot
# produce the unsigned simulator build). src-tauri/gen/* is gitignored and
# regenerated by `tauri <platform> init` each run; commit it only once it
# needs hand edits (release signing config, extra manifest permissions).

on:
  schedule:
    # Mondays 10:00 UTC, after scheduled.yml's desktop cargo check at 09:00.
    - cron: "0 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/build-tauri.mjs"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/build-tauri.mjs"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  # Scheduled runs get their own group: on the default branch they would
  # otherwise share `refs/heads/main` with path-filtered pushes, and a
  # cancelled run never satisfies the report job's failure() condition.
  group: mobile-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  android:
    name: Android (unsigned debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.11 (the Tauri 2.11 template) needs JDK 17+. setup-java also
      # exports JAVA_HOME, which the Tauri CLI reads first.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - uses: gradle/actions/setup-gradle@v4

      # The runner image preinstalls the SDK (cmdline-tools, build-tools,
      # platforms) and several NDKs, but exports ANDROID_NDK_HOME — Tauri only
      # reads NDK_HOME. Pin it explicitly: with it unset the CLI picks the
      # lexicographically last ndk/* dir, which silently changes whenever the
      # image adds a newer NDK.
      - name: Point Tauri at the preinstalled SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"; echo "NDK: $ANDROID_NDK_HOME"

      - run: npm ci

      # `tauri android build` never auto-inits; gen/android is gitignored.
      - name: Generate the Android project
        run: npx tauri android init --skip-targets-install

      # Runs build.beforeBuildCommand (npm run build:tauri) itself, so this
      # also proves the frontend export inside the real Tauri flow. One ABI
      # and APK-only keeps the cross-compile to a quarter of the default.
      - name: Build
        run: npx tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: doodaboo-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (simulator, unsigned)
    # macos-latest is macOS 26 / Xcode 26.x, where simulator builds are
    # reported working. If a device-arch link error (tauri-apps/tauri#15066,
    # -lswiftCompatibility56) ever surfaces here, the documented workaround
    # is `runs-on: macos-15` (Xcode 16.4). Never use an Intel runner for
    # simulator builds (#13456); arm64 + aarch64-sim only.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ios-sim

      # `tauri ios init` would brew-install this itself; doing it up front
      # keeps that step's timing predictable. CocoaPods is preinstalled.
      - run: brew install xcodegen

      - run: npm ci

      # Succeeds without an Apple team — it only warns that no signing
      # certificate was found, which the --no-sign build below doesn't need.
      - name: Generate the Xcode project
        run: npx tauri ios init --ci --skip-targets-install

      # Simulator target + --no-sign: xcodebuild archives with
      # CODE_SIGNING_ALLOWED=NO and the CLI moves the .app out of the
      # archive; no IPA, no certificates, no provisioning profile. Also runs
      # npm run build:tauri via beforeBuildCommand.
      - name: Build
        run: npx tauri ios build --target aarch64-sim --debug --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: doodaboo-ios-simulator-app
          path: src-tauri/gen/apple/build/arm64-sim/Doodaboo.app
          if-no-files-found: error
          retention-days: 14

  report:
    name: Open issue on scheduled failure
    needs: [android, ios]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          # Stable title so repeat weekly failures comment on the same issue.
          # The label is created on first use so the filter below is never
          # silently empty (which would open a duplicate issue every week).
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title = "[ops] Weekly mobile build failing";
            const label = "ops:mobile";
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: label, color: "d93f0b",
                description: "Weekly Android/iOS proof-of-build",
              });
            }
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `Failed again ${new Date().toISOString().slice(0, 10)}. Run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, labels: [label],
                body: [
                  "The weekly Android/iOS proof-of-build failed.", "",
                  `Run: ${runUrl}`, "",
                  "Common causes:",
                  "- A @tauri-apps/cli bump changed the template's SDK/Gradle versions",
                  "- The runner image rotated its Android NDK set or Xcode version",
                  "- A frontend change broke the static export (check the ci.yml export step first)",
                ].join("\n"),
              });
            }
